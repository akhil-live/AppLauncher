{% extends 'base.html' %}
{% load static %}

{% block title %}Admin Panel{% endblock %}

{% block content %}
<main class="content">
    <!-- Breadcrumb -->
    <section class="page-inner d-flex align-items-left align-items-md-center flex-column flex-md-row pt-2 pb-3">
         <div class="page-heading">
             <h1 class="page-title">Add SSO Authorization </h1>
             <nav aria-label="breadcrumb">
                 <ol class="breadcrumb">
                     <li class="breadcrumb-item">
                         <a href="{% url 'dashboard' %}">Dashboard</a>
                     </li>
                     <li class="breadcrumb-item">
                         <a href="{% url 'sso-authorization' %}">SSO Authorization</a>
                     </li>
                     <li class="breadcrumb-item">
                        Add SSO Authorization
                     </li>
                 </ol>
             </nav>
         </div>
    </section>

    <section class="mb-4">
     <div class="card">
         <div class="card-body p-4">
             <div class="section-heading">
                 <p>
                    Fields marked with <span class="star-required">*</span> are required.
                 </p>
             </div>
             <form id="AdvancedForm" class="needs-validation">
                 <div class="row g-4">
                    <div class="col-xl-4 col-lg-4 col-md-4 col-sm-6 col-12">
                        <label for="client" class="form-label">Client <span class="star-required">*</span></label>
                        <select class="form-select searchable-select" name="client" id="client" required>
                            <option value="">Select </option>
                            <option value="1">Client 1</option>
                            <option value="2">Client 2</option>
                            <option value="3">Client 3</option>
                       </select>
                    </div>
                    <div class="col-xl-4 col-lg-4 col-md-4 col-sm-6 col-12">
                        <label for="user" class="form-label">User <span class="star-required">*</span></label>
                        <select class="form-select searchable-select" name="user" id="user" required>
                            <option value="">Select </option>
                            <option value="1">User 1</option>
                            <option value="2">User 2</option>
                            <option value="3">User 3</option>
                       </select>
                    </div>
                    <div class="col-xl-4 col-lg-4 col-md-4 col-sm-6 col-12">
                        <label for="ulb" class="form-label">ULB <span class="star-required">*</span></label>
                        <select class="form-select searchable-select" name="ulb" id="ulb" required>
                            <option value="">Select ULB</option>
                            <option value="jmc">Bikaner Municipal Corporation</option>
                            <option value="bmc">Jodhpur Municipal Corporation</option>
                            <option value="umc">Udaipur Municipal Corporation</option>
                       </select>
                    </div>
                    <div class="col-xl-4 col-lg-4 col-md-4 col-sm-6 col-12">
                        <label for="url" class="form-label">Redirect URL <span class="star-required">*</span></label>
                        <input type="text" class="form-control" id="url" name="url" placeholder="Enter redirect url" required>
                    </div>
                    <div class="col-xl-4 col-lg-4 col-md-4 col-sm-6 col-12">
                        <label for="expiresDate" class="form-label">Expires Date <span class="star-required">*</span></label>
                        <input type="date" class="form-control" id="expiresDate" name="expiresDate" required>
                    </div>
                    <div class="col-xl-4 col-lg-4 col-md-4 col-sm-6 col-12">
                        <label for="usedDate" class="form-label">Used Date <span class="star-required">*</span></label>
                        <input type="date" class="form-control" id="usedDate" name="usedDate" required>
                    </div>
                    <div class="d-print-none">
                        <p class="text-center pt-2">
                          <button type="submit" class="btn btn-primary btn-sm">Submit</button>
                          <a href="{% url 'sso-authorization' %}"><button type="button" class="btn btn-secondary btn-sm" name="button">Back</button></a>
                        </p>
                    </div>
                 </div>
             </form>
         </div>
     </div>

 </section>
</main>
{% endblock %}
